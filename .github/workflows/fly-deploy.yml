name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy 9d-book to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # build on this 16GB runner (the small remote builder died at yarn install, exit 137 = out of memory)
      - run: flyctl deploy --local-only -a 9d-book
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
