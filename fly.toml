app = "9d-book"
primary_region = "ams"

[build]
  [build.args]
    NEXT_PUBLIC_WEBAPP_URL = "https://book.9dcreatornetwork.com"
    CALCOM_TELEMETRY_DISABLED = "1"
    DATABASE_URL = "postgresql://placeholder:placeholder@localhost:5432/placeholder"

[env]
  NEXT_PUBLIC_WEBAPP_URL = "https://book.9dcreatornetwork.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    # first boot runs database migrations + app-store seed, give it time
    grace_period = "600s"
    method = "GET"
    path = "/auth/login"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
